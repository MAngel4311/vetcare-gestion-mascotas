spring.application.name=vet-care
server.port=8080

# --- PostgreSQL (usa variables de entorno para no subir claves a GitHub) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/vetcare
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:cambia_esta_clave}

# --- JPA / Hibernate ---
# update: Hibernate crea/ajusta las tablas solo (cómodo para desarrollar)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- CORS: orígenes del frontend permitidos (separados por coma) ---
vetcare.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:5500,http://127.0.0.1:5500

# --- Correo (confirmaciones y recordatorios por email) ---
# Para activarlo NO hace falta tocar este archivo: define estas variables de entorno
# (en IntelliJ: Run > Edit Configurations > Environment variables) y reinicia:
#   MAIL_HOST=smtp.gmail.com   MAIL_USER=tucorreo@gmail.com   MAIL_PASSWORD=<contraseña de aplicación de Google>
# Sin MAIL_HOST la app funciona igual, pero solo escribe en la consola que el correo no se envió.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
vetcare.mail.from=${MAIL_USER:no-reply@vetcare.local}

# --- Seguridad (JWT) ---
# En producción define JWT_SECRET con una clave propia de al menos 32 caracteres.
vetcare.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres!}
# Duración del token en minutos (480 = 8 horas)
vetcare.jwt.expiracion-minutos=480
# Crea 3 usuarios de demostración (admin, recepcion, veterinario) si no existe ningún usuario.
# Ponlo en false cuando ya tengas tus propios usuarios.
vetcare.seed.usuarios-demo=true

# --- Agenda: horario de atención (para calcular las horas libres de un veterinario) ---
vetcare.agenda.hora-apertura=08:00
vetcare.agenda.hora-cierre=18:00
# Las citas solo se aceptan de lunes a sábado dentro de este horario (RN-03).

# --- Recordatorio de vacunas por correo (RF-13) ---
# Avisa las dosis que vencen dentro de este margen de días; corre todos los días a las 08:00.
vetcare.vacunas.recordatorio-habilitado=true
vetcare.vacunas.recordatorio-dias=7
vetcare.vacunas.recordatorio-cron=0 0 8 * * *

# --- Recordatorio de la cita por correo ---
# Cada 15 minutos avisa las citas que empiezan en las próximas 24 horas (una sola vez por cita).
vetcare.citas.recordatorio-habilitado=true
vetcare.citas.recordatorio-horas=24
